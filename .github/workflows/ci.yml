name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad e integración (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, fileinfo, pdo_sqlite, sqlite3, zlib
          coverage: none
          tools: composer:v2

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ubicar la caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Instalar dependencias de PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar dependencias de JavaScript
        run: npm ci

      - name: Compilar la interfaz
        run: npm run build

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Calidad (phpcs, PHPStan y pruebas)
        run: composer quality

      - name: Pruebas de integración contra el sistema real
        run: php artisan test tests/Integration
